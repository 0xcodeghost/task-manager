<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TaskFlow - a simple task manager with categories, due dates and filters.">
    <title>TaskFlow | Task Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>

    <main class="app">

        <!-- App Header -->
        <header class="app-header">
            <h1>Task<span>Flow</span></h1>
            <p>Plan your day. Finish what matters.</p>
        </header>

        <!-- Add Task Form -->
        <form class="task-form" id="task-form">
            <input type="text" id="task-input" placeholder="What needs to be done?"
                   maxlength="100" autocomplete="off" required>

            <select id="category-select">
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Study">Study</option>
            </select>

            <input type="date" id="due-date">

            <button type="submit" class="btn-add">Add Task</button>
        </form>

        <!-- Toolbar: search + filters + counter -->
        <section class="toolbar">
            <input type="search" id="search-input" placeholder="Search tasks...">

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <p class="task-count" id="task-count">0 tasks left</p>
        </section>

        <!-- Task List -->
        <ul class="task-list" id="task-list"></ul>

        <!-- Shown when there are no tasks -->
        <p class="empty-state" id="empty-state">No tasks yet. Add your first task above.</p>

    </main>

    <script src="src/js/script.js"></script>
</body>
</html>
